<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="920" viewBox="0 0 2200 920">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#202124"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#202124}.lane{fill:#fff;stroke:#202124;stroke-width:2}.task{fill:#fff;stroke:#202124;stroke-width:2.4}.flow{fill:none;stroke:#202124;stroke-width:2.2;marker-end:url(#arrow)}.label{font-size:15px}.small{font-size:13px}.title{font-size:23px;font-weight:bold}.laneName{font-size:14px;font-weight:bold}</style>
  </defs>
  <text x="38" y="35" class="title">Mitlex: заявка и уведомления — Yandex Forms → Tracker → Messenger</text>
  <rect x="35" y="60" width="2125" height="800" class="lane"/>
  <rect x="35" y="60" width="2125" height="155" class="lane"/><rect x="35" y="215" width="2125" height="155" class="lane"/><rect x="35" y="370" width="2125" height="155" class="lane"/><rect x="35" y="525" width="2125" height="155" class="lane"/><rect x="35" y="680" width="2125" height="180" class="lane"/>
  <g transform="translate(62 170) rotate(-90)"><text class="laneName">Инициатор / владелец процесса</text></g><g transform="translate(62 320) rotate(-90)"><text class="laneName">Yandex Forms</text></g><g transform="translate(62 480) rotate(-90)"><text class="laneName">Yandex Tracker</text></g><g transform="translate(62 635) rotate(-90)"><text class="laneName">Python / Flask integration</text></g><g transform="translate(62 810) rotate(-90)"><text class="laneName">Yandex Messenger</text></g>

  <circle cx="135" cy="137" r="22" fill="#fff" stroke="#202124" stroke-width="3"/><text x="88" y="183" class="small">Потребность</text>
  <rect x="205" y="96" width="175" height="82" rx="12" class="task"/><text x="230" y="130" class="label">Заполнить</text><text x="218" y="153" class="label">Yandex Forms</text>
  <polygon points="455,270 495,310 455,350 415,310" fill="#fff" stroke="#202124" stroke-width="2.4"/><text x="404" y="365" class="small">Поля полны?</text>
  <rect x="555" y="96" width="145" height="82" rx="12" class="task"/><text x="575" y="130" class="label">Уточнить</text><text x="570" y="153" class="label">заявку</text>
  <rect x="590" y="405" width="175" height="82" rx="12" class="task"/><text x="610" y="438" class="label">Создать задачу</text><text x="607" y="461" class="label">с полями</text>
  <rect x="830" y="405" width="185" height="82" rx="12" class="task"/><text x="847" y="438" class="label">Назначить очередь,</text><text x="852" y="461" class="label">владельца, статус</text>
  <rect x="1080" y="405" width="178" height="82" rx="12" class="task"/><text x="1102" y="438" class="label">Webhook: задача</text><text x="1117" y="461" class="label">создана</text>
  <rect x="1325" y="560" width="170" height="82" rx="12" class="task"/><text x="1344" y="593" class="label">Проверить подпись</text><text x="1363" y="616" class="label">и event ID</text>
  <rect x="1560" y="560" width="185" height="82" rx="12" class="task"/><text x="1578" y="593" class="label">Собрать сообщение:</text><text x="1590" y="616" class="label">поля, вложения</text>
  <rect x="1570" y="715" width="205" height="82" rx="12" class="task"/><text x="1589" y="748" class="label">Чат владельца</text><text x="1585" y="771" class="label">процесса / тред</text>
  <rect x="1830" y="715" width="130" height="82" rx="12" class="task"/><text x="1846" y="748" class="label">Копия</text><text x="1838" y="771" class="label">инициатору</text>
  <rect x="1875" y="96" width="205" height="82" rx="12" class="task"/><text x="1894" y="130" class="label">Менять статус /</text><text x="1888" y="153" class="label">добавлять вложения</text>
  <rect x="1885" y="405" width="190" height="82" rx="12" class="task"/><text x="1905" y="438" class="label">Webhook: статус</text><text x="1915" y="461" class="label">или вложение</text>
  <rect x="1880" y="560" width="168" height="82" rx="12" class="task"/><text x="1898" y="593" class="label">Проверить и</text><text x="1890" y="616" class="label">дедуплицировать</text>
  <rect x="2075" y="560" width="140" height="82" rx="12" class="task"/><text x="2093" y="593" class="label">Найти чат</text><text x="2095" y="616" class="label">и тред</text>
  <rect x="2010" y="715" width="145" height="82" rx="12" class="task"/><text x="2024" y="748" class="label">Обновить</text><text x="2018" y="771" class="label">тред / автора</text>
